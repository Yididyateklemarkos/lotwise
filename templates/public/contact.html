{% extends "base.html" %}
{% block title %}Contact | Lotwise{% endblock %}
{% block content %}
<div style="max-width:520px;">
  <h1>Contact us</h1>
  <p class="muted" style="margin:12px 0 24px;">For anything that doesn't fit a specific request. Drop your details below.</p>

  <div class="card">
    <form class="stacked" method="POST">
      <label>Your name</label>
      <input type="text" name="name" required>
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Phone (optional)</label>
      <input type="tel" name="phone">
      <label>Message</label>
      <textarea name="message" rows="5" required></textarea>
      <button type="submit" class="btn btn-solid btn-block" style="margin-top:20px; padding:13px;">Send message</button>
    </form>
  </div>
</div>
{% endblock %}
